name: Deploy

# The fuzz suite gates the deploy. A subtly wrong Raft teaches wrong Raft, so no
# build reaches Pages without all five safety properties holding across the whole
# randomized suite. Do not weaken this.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # No `version:` here on purpose. package.json's `packageManager` field pins the
      # exact pnpm the project is developed against, and the action reads it. Setting
      # both makes the action refuse to start rather than silently pick one.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Figure 2 conformance
        run: pnpm test:figure2

      - name: Figure 13 conformance (log compaction)
        run: pnpm test:figure13

      - name: Section 6 conformance (membership changes)
        run: pnpm test:section6

      - name: Determinism
        run: pnpm test:determinism

      - name: Figure 8
        run: pnpm test:figure8

      - name: Ablation — every toggle breaks its property
        run: pnpm test:ablation

      # The backbone of the correctness argument. Slow on purpose.
      - name: Invariant fuzzing
        run: pnpm test:fuzz

  build:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # No `version:` here on purpose. package.json's `packageManager` field pins the
      # exact pnpm the project is developed against, and the action reads it. Setting
      # both makes the action refuse to start rather than silently pick one.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Verify the export
        run: |
          test -f out/.nojekyll || { echo "out/.nojekyll is missing"; exit 1; }
          test -f out/index.html || { echo "out/index.html is missing"; exit 1; }
          test -f out/id/simulasi/index.html || { echo "the simulation page is missing"; exit 1; }
          test -f out/sw.js || { echo "the service worker was not generated"; exit 1; }
          # The offline claim in PRD section 12 is only as good as the manifest, so
          # check every route and every build asset is actually in it.
          node --input-type=module -e '
            import { readFile, readdir } from "node:fs/promises"
            import { join, relative, sep } from "node:path"
            const sw = await readFile("out/sw.js", "utf8")
            const walk = async (d) => (await Promise.all(
              (await readdir(d, { withFileTypes: true })).map((e) =>
                e.isDirectory() ? walk(join(d, e.name)) : [join(d, e.name)])
            )).flat()
            const files = (await walk("out"))
              .map((f) => relative("out", f).split(sep).join("/"))
              .filter((f) => f !== "sw.js" && f !== ".nojekyll")
            const missing = files.filter((f) => !sw.includes(`"/mufakat/${f}"`))
            if (missing.length) {
              console.error("not precached:", missing.join(", "))
              process.exit(1)
            }
            for (const route of ["/mufakat/", "/mufakat/id/", "/mufakat/id/simulasi/"]) {
              if (!sw.includes(`"${route}"`)) {
                console.error("route not precached:", route)
                process.exit(1)
              }
            }
            console.log(`Service worker precaches ${files.length} files and every route.`)
          '

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
